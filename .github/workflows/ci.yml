name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Testy Rejestru na PGlite
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lokalne Supabase
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Zmienne środowiskowe z lokalnego Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "DATABASE_URL=$DB_URL"
            echo "REGISTRY_TEST_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Testy Rejestru na Supabase
        run: npm test

      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Test dymny Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
