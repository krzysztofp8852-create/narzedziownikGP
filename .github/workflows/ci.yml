name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Testy Rejestru na PGlite
        run: npm test

      # Wersja CLI z package-lock.json, ta sama co lokalnie.
      - uses: supabase/setup-cli@v3

      # Storage zostaje: nagrania głosowe przechodzą przez kubełek `nagrania`.
      - name: Lokalne Supabase
        run: supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Zmienne środowiskowe z lokalnego Supabase
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "DATABASE_URL=$DB_URL"
            echo "REGISTRY_TEST_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Testy Rejestru na Supabase
        run: npm test

      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # Firma demo do testu mapy demo (e2e/site-map.spec.ts); bez niej ten test się pomija.
      - name: Demo w bazie CI
        run: npm run demo:create

      - name: Test dymny Playwright
        run: npm run test:e2e
        env:
          # Mapa budów bez Google: adresy geokoduje się na stały punkt, a przeglądarka dostaje atrapę mapy.
          GEOCODER: staly
          GOOGLE_MAPS_BROWSER_KEY: e2e
          # Wpis tekstem bez OpenAI API: interpretacja słowami kluczowymi.
          TEXT_ENTRY_INTERPRETER: slowa
          # Nagranie bez dostawcy transkrypcji: każde „mówi” ten sam tekst.
          TRANSCRIPTION_PROVIDER: staly
          TRANSCRIPTION_FIXED_TEXT: biorę dwie szlifierki na Rataje
          # Polityka treści blokuje, a nie tylko raportuje: każdy test sprawdza, że niczego nie psuje (ADR 0041).
          CSP_ENFORCE: "1"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
